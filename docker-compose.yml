services:
  db:
    image: postgres:17
    container_name: biomedical_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biomedical_platform}
      POSTGRES_USER: ${POSTGRES_USER:-biomedical_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biomedical_user} -d ${POSTGRES_DB:-biomedical_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
